[project]
name = "birbcrew"
version = "0.1.0"
description = "Disposable durable coworker conversation proof"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic-ai-slim[ag-ui,temporal,openai]==2.66.0",
  "ag-ui-protocol==1.0.0",
  "temporalio==1.35.0",
  "psycopg[binary]==3.3.8",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "opentelemetry-sdk==1.45.2",
  "httpx==0.28.1",
  "httpx-sse==0.4.3",
  "wsproto==1.3.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
