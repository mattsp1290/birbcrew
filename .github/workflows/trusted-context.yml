name: Trusted application context qualification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'native/**'
      - 'tests/service/**'
      - 'tests/fixtures/engines/**'
      - 'package*.json'
      - 'vendor/**'
      - '.github/workflows/trusted-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: birbcrew
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: trusted_context_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BIRBCREW_TEST_DATABASE_URL: postgresql://birbcrew:fixture-only@127.0.0.1:5432/trusted_context_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:trusted
      - name: Existing member store and proxy regression
        run: |
          node --test tests/service/store.test.ts
          npm run test:proxy
