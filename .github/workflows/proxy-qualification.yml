name: AI proxy qualification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'docs/ai-proxy-profiles.md'
      - 'native/**'
      - 'tests/service/**'
      - 'tests/proxy-relay.test.ts'
      - 'tests/fixtures/engines/**'
      - 'package*.json'
      - 'vendor/**'
      - 'packages/**'
      - '.github/workflows/proxy-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:proxy
      - run: npm test
