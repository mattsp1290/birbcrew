name: AI proxy qualification
on:
  pull_request:
    paths:
      - 'src/service/**'
      - 'docs/ai-proxy-profiles.md'
      - 'native/**'
      - 'tests/service/**'
      - 'tests/proxy-relay.test.ts'
      - 'tests/fixtures/engines/**'
      - 'tests/proof/**'
      - 'package*.json'
      - 'vendor/**'
      - 'packages/**'
      - '.github/workflows/proxy-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:proxy
      - run: npm run test:telemetry
      - run: npm test
      - name: Codex sign-in on a read-only home
        run: node --test tests/service/codex-subscription.test.ts
  proxy-service-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Temporal CLI
        run: |
          mkdir -p .proof/bin
          archive=temporal_cli_1.10.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/temporalio/cli/releases/download/v1.10.0/$archive" -o ".proof/bin/$archive"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.10.0/checksums.txt -o .proof/bin/checksums.txt
          (cd .proof/bin && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf ".proof/bin/$archive" -C .proof/bin temporal
      - run: npm run test:proxy:restart
        env:
          TEMPORAL_CLI: ${{ github.workspace }}/.proof/bin/temporal
